<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Baron Sneakers Admin</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"><link rel="icon" href="assets/baron-sneakers-logo.png" type="image/png"></head><body>
<header class="band admin-band"><img class="brand-logo" src="assets/baron-sneakers-logo.png" alt="Baron Sneakers"><div class="admin-heading"><span class="admin-kicker">Operations</span><h1>Admin workspace</h1></div></header>
<main class="pad admin-content" id="m"></main>
<nav class="tabs" aria-label="Main navigation"><details class="nav-menu"><summary>Menu</summary><div class="nav-menu-panel"><a href="index.html">Shop</a><a href="wholesale.html">Wholesale</a><a href="track.html">Track</a><a class="on" aria-current="page" href="admin.html">Admin</a></div></details><a class="desktop-link" href="index.html">Shop</a><a class="desktop-link" href="wholesale.html">Wholesale</a><a class="desktop-link" href="track.html">Track</a><a class="desktop-link on" aria-current="page" href="admin.html">Admin</a><button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode">☾</button></nav>
<script src="assets/api.js"></script><script src="assets/theme.js"></script><script>
let PRODUCT_COLORS=[];
let tab='o',O=[];
async function login(){try{await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#ae').value,password:$('#ap').value,totp:$('#at').value,hp:$('#hp').value,turnstileToken:turnstileToken($('#ts'))})}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error)});sessionStorage.adm=1;await loadOrders();draw()}catch(e){$('#er').textContent=e.message}}
function tabs(){return`<div class="admin-toolbar"><div class="chips"><button class="chip${tab=='o'?' on':''}" onclick="tab='o';draw()">Orders</button><button class="chip${tab=='a'?' on':''}" onclick="tab='a';draw()">Add sneaker</button><button class="chip${tab=='s'?' on':''}" onclick="tab='s';draw()">Settings</button></div><button class="btn admin-logout" onclick="logout()">Sign out</button></div>`}
const statusNames={awaiting_payment:'Awaiting payment',paid:'Paid',sent_to_warehouse:'Sent to warehouse',arrived_at_tudu:'Arrived at Tudu',delivered:'Delivered',cancelled:'Cancelled',expired:'Expired'};
const statusNumber=s=>({awaiting_payment:0,paid:1,sent_to_warehouse:2,arrived_at_tudu:3,delivered:4}[s]??-1);
const itemText=o=>(o.items||[]).map(x=>`${x.quantity}x ${x.product_name}${x.colorway?` — ${x.colorway}`:''} EU ${x.size}`).join(', ');
const holdText=o=>o.status==='awaiting_payment'?` · Hold until ${new Date(o.holdExpires).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Accra'})}`:o.arrivalDate?` · In Accra ${esc(o.arrivalDate)}`:'';
async function loadOrders(){const r=await fetch('/api/admin/orders');if(r.status===401){sessionStorage.removeItem('adm');throw new Error('Admin session expired. Please sign in again.')}if(!r.ok)throw new Error('Could not load orders.');const data=await r.json();O=data.map(o=>({...o,st:statusNumber(o.status)}))}
async function draw(){const m=$('#m');
if(!sessionStorage.adm){m.innerHTML='<section class="admin-auth"><span class="admin-kicker">Restricted area</span><h2>Sign in to operations</h2><p class="muted">Manage orders, payments, and the sneaker catalogue.</p><input id="ae" placeholder="Email" type="email" autocomplete="username"><input id="ap" placeholder="Password" type="password" autocomplete="current-password"><input id="at" placeholder="6-digit code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true"><div id="ts"></div><p id="er" class="muted" role="alert"></p><button class="btn" onclick="login()">Sign in</button></section>';mountTurnstile($('#ts'));return}
if(tab=='a')return catalogueView(m);
if(tab=='s')return settingsView(m);
m.innerHTML=tabs()+`<section class="admin-summary"><div><b>${O.length}</b><span>Orders</span></div><div><b>${O.filter(o=>o.status==='awaiting_payment').length}</b><span>Awaiting payment</span></div><div><b>GHS ${O.filter(o=>o.st>0).reduce((sum,o)=>sum+Number(o.total||0),0)}</b><span>Paid order value</span></div></section><section class="admin-orders">${O.length?O.map((o,i)=>`<article class="admin-order"><div class="order-head"><div><span class="admin-kicker">${esc(o.ref)} · ${esc(o.type)}</span><h2>${esc(o.name)}</h2></div><span class="badge${o.st>0?' f':''}">${esc(statusNames[o.status]||o.status)}</span></div><p class="muted">${esc(itemText(o))} · GHS ${esc(o.total)}${holdText(o)}</p><p class="muted">${esc(o.phone)} · ${esc(o.location)} · ${esc(o.pay)}${o.transactionId?` · Txn ${esc(o.transactionId)}`:''}</p><div class="order-actions">${act(o,i)}</div></article>`).join(''):'<p class="muted">No orders yet.</p>'}</section>`}
async function catalogueView(m){try{if(!PRODUCT_COLORS.length)PRODUCT_COLORS=(await Api.catalogueOptions()).colors.map(c=>c.name);const r=await fetch('/api/admin/products');const data=await r.json();if(r.status===401){sessionStorage.removeItem('adm');return draw()}if(!r.ok)throw new Error(data.error||'Could not load catalogue.');m.innerHTML=tabs()+`<section class="admin-panel"><span class="admin-kicker">Catalogue</span><h2 id="catalogue-form-title">Add sneaker</h2><p class="muted">Treat every model and colourway as a separate product. Prices are calculated from the CFA cost and current rate.</p><div class="admin-form-grid"><input id="nm" placeholder="Sneaker name"><select id="br" aria-label="Brand"><option value="">Choose brand</option>${['Adidas','ASICS','Brooks','Converse','Crocs','Fila','HOKA','Jordan','Mizuno','New Balance','Nike','On','PUMA','Reebok','Salomon','Saucony','Skechers','Under Armour','Vans'].map(b=>`<option value="${b}">${b}</option>`).join('')}</select><input id="cw" placeholder="Colourway, e.g. Triple Black"><select id="pc" aria-label="Primary colour"><option value="">Primary colour</option>${PRODUCT_COLORS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select><select id="ac" aria-label="Accent colour"><option value="">No accent colour</option>${PRODUCT_COLORS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select><input id="cf" type="number" placeholder="Cost in CFA, e.g. 12000" oninput="pv()"><input id="sz" placeholder="Sizes and stock, e.g. 41:2, 42:3"><input id="ft" placeholder="Fit note"><input id="sh" type="number" placeholder="Size shift" value="0"></div><p class="muted" id="pv"></p><label class="ck"><input type="checkbox" id="or">On request</label><label class="ck"><input type="checkbox" id="ex">Exclusive</label><input type="file" accept="image/jpeg,image/png,image/webp" aria-label="Product photo"><input type="hidden" id="edit-id"><div class="catalogue-form-actions"><button class="btn" id="catalogue-submit" onclick="pub()">Publish sneaker</button><button class="btn o" id="catalogue-cancel" onclick="cancelEdit()" hidden>Cancel edit</button></div></section><section class="admin-panel catalogue-panel"><div class="catalogue-heading"><div><span class="admin-kicker">Catalogue</span><h2>Current sneakers</h2></div><span class="muted">${data.length} listed</span></div><div class="catalogue-list">${data.length?data.map(productRow).join(''):'<p class="muted">No sneakers listed.</p>'}</div></section>`}catch(e){m.innerHTML=tabs()+`<p class="muted" role="alert">${e.message}</p>`}}
function productRow(product){return`<article class="catalogue-row"><div><strong>${esc(product.name)}</strong><span class="muted">${esc(product.brand)} · ${esc(product.colorway)} · GHS ${product.retail}</span></div><div class="catalogue-actions"><button class="btn o" onclick="editProduct(${product.id})">Edit</button><button class="btn o remove-product" onclick="removeProduct(${product.id},this)">Remove</button></div></article>`}
async function settingsView(m){try{const r=await fetch('/api/admin/settings');const data=await r.json();if(r.status===401){sessionStorage.removeItem('adm');return draw()}if(!r.ok)throw new Error(data.error||'Could not load settings.');m.innerHTML=tabs()+`<section class="admin-panel"><span class="admin-kicker">Warehouse pricing</span><h2>Exchange rate</h2><p class="muted">Use the warehouse rate for every 1,000 CFA. New catalogue prices will use the updated rate; existing order totals stay unchanged.</p><label for="rate">GHS per 1,000 CFA</label><input id="rate" type="number" min="0.01" max="1000" step="0.0001" value="${data.rate}"><p class="rate-example muted">Example: 12,000 CFA × ${data.rate} ÷ 1,000 = GHS ${(12*data.rate).toFixed(2)} cost</p><label for="hol">No-dispatch holidays (YYYY-MM-DD, comma separated)</label><input id="hol" placeholder="2026-12-25, 2027-01-01" value="${esc((data.holidays||[]).join(', '))}"><p id="seter" class="muted" role="alert"></p><button class="btn" onclick="saveRate()">Save settings</button></section>`}catch(e){m.innerHTML=tabs()+`<p class="muted" role="alert">${e.message}</p>`}}
const B=(t,f,c='')=>`<button class="btn admin-action ${c}" onclick="${f}">${t}</button>`;
function act(o,i){const actions=[];if(o.st===-1)return B('Message buyer',`msg(${i})`,'o');if(o.st===0)actions.push(B('Mark paid',`paid(${i})`),B('Extend hold',`update(O[${i}].ref,{action:'extend'})`,'o'));if(o.st===1)actions.push(B('Send to warehouse',`ship(${i})`));if(o.st===2)actions.push(B('Mark arrived',`nx(${i})`));if(o.st===3)actions.push(B('Mark delivered',`nx(${i})`,'o'));if(o.st<3)actions.push(B('Cancel',`cx(${i})`,'o'));actions.push(B('Message buyer',`msg(${i})`,'o'));return actions.join('')}
async function update(ref,body){const r=await fetch('/api/admin/orders/'+encodeURIComponent(ref),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.removeItem('adm');return draw()}if(!r.ok)return alert(d.error||'Could not update the order.');await loadOrders();draw()}
function paid(i){const t=prompt('MoMo or bank transaction ID');if(t)update(O[i].ref,{action:'paid',transactionId:t})}
function ship(i){const t=`Order ${O[i].ref}`;navigator.clipboard?.writeText(t);update(O[i].ref,{action:'ship'})}
const nx=i=>update(O[i].ref,{action:O[i].st===2?'arrive':'deliver'}),cx=i=>{if(confirm('Cancel this order?'))update(O[i].ref,{action:'cancel'})};
const waPhone=p=>{const d=String(p).replace(/\D/g,'');return d.startsWith('0')?'233'+d.slice(1):d};
const msg=i=>open(`https://wa.me/${waPhone(O[i].phone)}?text=${encodeURIComponent('Your order '+O[i].ref+' has arrived in Accra. Delivery fee to your area: GHS __')}`);
async function price(costCfa){const r=await fetch('/api/admin/settings').then(x=>x.json()).catch(()=>({rate:21.5}));const costGhs=costCfa/1000*r.rate;return{retail:Math.ceil((costGhs+100)/10)*10,wholesale:Math.round((costGhs+40)*100)/100}}
async function pv(){const p=await price(+$('#cf').value||0);$('#pv').textContent=`Retail GHS ${p.retail} · Wholesale GHS ${p.wholesale}`}
async function pub(){const sizes=Object.fromEntries($('#sz').value.split(',').map(part=>part.trim().split(':').map(Number)).filter(([size,quantity])=>Number.isInteger(size)&&Number.isInteger(quantity)&&size>0&&quantity>=0));const fileInput=document.querySelector('input[type="file"]');const body={name:$('#nm').value.trim(),brand:$('#br').value.trim(),colorway:$('#cw').value.trim(),primaryColor:$('#pc').value,accentColor:$('#ac').value,costCfa:Number($('#cf').value),sizes,fit:$('#ft').value.trim(),shift:Number($('#sh').value)||0,onRequest:$('#or').checked,exclusive:$('#ex').checked};const editId=$('#edit-id').value;const error=document.querySelector('#pv');try{let r;if(fileInput.files.length>0){const fd=new FormData();Object.entries(body).forEach(([k,v])=>fd.append(k,k==='sizes'?JSON.stringify(v):v));if(fileInput.files.length)fd.append('image',fileInput.files[0]);r=await fetch(editId?'/api/admin/products/'+editId:'/api/admin/products',{method:editId?'PATCH':'POST',body:fd});}else{r=await fetch(editId?'/api/admin/products/'+editId:'/api/admin/products',{method:editId?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}const data=await r.json();if(!r.ok)throw new Error(data.error||`Could not ${editId?'update':'publish'} sneaker.`);error.textContent=`${editId?'Updated':'Published'} ${data.name} — ${data.colorway}. Retail GHS ${data.retail}.`;error.className='success-note';await catalogueView($('#m'));}catch(e){error.textContent=e.message;error.className='muted';}}
async function editProduct(id){const product=await fetch('/api/admin/products').then(r=>r.json()).then(items=>items.find(item=>item.id===id));if(!product)return;$('#edit-id').value=product.id;$('#nm').value=product.name;$('#br').value=product.brand;$('#cw').value=product.colorway||'';$('#pc').value=product.primary_color||'';$('#ac').value=product.accent_color||'';$('#cf').value=product.cost_cfa;$('#sz').value=Object.entries(product.sizes).map(([size,quantity])=>`${size}:${quantity}`).join(', ');$('#ft').value=product.fit||'';$('#sh').value=product.shift||0;$('#or').checked=product.on_request;$('#ex').checked=product.exclusive===true;$('#catalogue-form-title').textContent='Edit sneaker';$('#catalogue-submit').textContent='Save changes';$('#catalogue-cancel').hidden=false;$('#nm').focus();window.scrollTo({top:0,behavior:'smooth'});}
function cancelEdit(){catalogueView($('#m'))}
async function removeProduct(id,button){const name=button.closest('.catalogue-row').querySelector('strong').textContent;if(!confirm(`Remove ${name} from the catalogue?`))return;try{const r=await fetch('/api/admin/products/'+id,{method:'DELETE'});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not remove sneaker.');await draw()}catch(e){alert(e.message)}}
async function saveRate(){const error=$('#seter');try{const r=await fetch('/api/admin/settings',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({rate:Number($('#rate').value),holidays:$('#hol').value.split(',').map(s=>s.trim()).filter(Boolean)})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not save settings.');error.textContent=`Saved. New prices will use ${data.rate}. ${data.holidays.length} holiday(s) set.`;error.className='success-note';}catch(e){error.textContent=e.message;error.className='muted';}}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});sessionStorage.removeItem('adm');location.reload()}
draw();
</script></body></html>
