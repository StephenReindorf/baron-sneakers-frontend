services:
  - type: web
    name: baron-sneakers
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/arrival
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_MEMORY_DB
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DEV_ADMIN_EMAIL
        sync: false
      - key: DEV_ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: WHOLESALE_ACCESS_CODE
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
